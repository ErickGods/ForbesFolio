name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
assignees: ["ErickGods"]

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        Have an idea to improve ForbesFolio? We'd love to hear it!

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A brief summary of the feature or improvement.
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What problem does it solve?
      placeholder: Explain the motivation behind this request...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How do you envision this feature working?
      placeholder: Describe your ideal solution...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know when this feature is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - 🔴 High — Critical for the project
        - 🟠 Medium — Would significantly improve experience
        - 🟡 Low — Nice to have
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area of the site does this affect?
      multiple: true
      options:
        - Header / Navigation
        - Hero Section
        - Featured Work / Portfolio
        - About Section
        - Contact Section
        - Footer
        - Performance
        - Accessibility
        - CI/CD Pipeline
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Any links, mockups, or examples that illustrate the idea?
      placeholder: Add links or drag images here...
    validations:
      required: false
