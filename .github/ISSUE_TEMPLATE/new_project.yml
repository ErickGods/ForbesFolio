name: 📂 New Project
description: Add a new project to the ForbesFolio portfolio magazine
title: "[Project]: "
labels: ["project", "enhancement"]
assignees: ["ErickGods"]

body:
  - type: markdown
    attributes:
      value: |
        ## Add a New Project to the Magazine
        Fill out this form to register a new project. After the issue is created,
        follow the steps in `projects/_template/README.md` to add all files.

  - type: input
    id: title
    attributes:
      label: Project Title
      description: The display name for the magazine page.
      placeholder: "e.g. Vault Tech Corporate Website"
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: Project Slug
      description: Folder name (lowercase, hyphens only).
      placeholder: "e.g. vault-tech-website"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Primary category for the project.
      options:
        - Web Development
        - UI/UX Design
        - Data Analysis
        - Automation
        - Mobile App
        - DevOps
        - Machine Learning
        - Power Platform
        - Supply Chain & MES
        - Branding
        - Product Design
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: Year
      description: Year the project was completed.
      placeholder: "2025"
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Client / Company
      description: Who was the project for?
      placeholder: "e.g. Vault Tech"
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Your Role
      description: What was your role in this project?
      placeholder: "e.g. Full-Stack Developer"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A concise description for the magazine page (1-3 sentences).
      placeholder: "Describe the project and your contribution..."
    validations:
      required: true

  - type: textarea
    id: technologies
    attributes:
      label: Technologies Used
      description: List the main technologies used.
      placeholder: |
        - React
        - Node.js
        - PostgreSQL
    validations:
      required: true

  - type: input
    id: demo-url
    attributes:
      label: Live Demo URL
      description: Link to the live project (if available).
      placeholder: "https://..."
    validations:
      required: false

  - type: input
    id: repo-url
    attributes:
      label: Repository URL
      description: Link to the source code (if public).
      placeholder: "https://github.com/..."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Confirm you will complete these steps in the PR.
      options:
        - label: I will create a `projects/<slug>/` folder with a filled README.md
          required: true
        - label: I will add a cover image (16:9, min 800x450px)
          required: true
        - label: I will register the project in `website/src/data/projects.js`
          required: true
        - label: I will copy the cover image to `website/public/images/projects/`
          required: true
