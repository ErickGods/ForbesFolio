name: PR Preview Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: 📦 Build Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build project
        run: npm run build
        working-directory: website

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-pr-${{ github.event.pull_request.number }}
          path: website/dist
          retention-days: 7

      - name: Comment PR with preview info
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const runId = context.runId;
            const artifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;

            const body = `## 📦 Preview Build Ready

            A preview build has been generated for this PR.

            | Detail | Value |
            |--------|-------|
            | **PR** | #${prNumber} |
            | **Commit** | \`${context.sha.substring(0, 7)}\` |
            | **Artifact** | [Download from Actions](${artifactUrl}) |

            > Download the artifact, extract it, and open \`index.html\` to preview the changes locally.

            ---
            *🤖 Generated by [PR Preview Build](.github/workflows/pr-preview.yml)*`;

            // Check if bot already commented
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const botComment = comments.data.find(
              (c) => c.body.includes('📦 Preview Build Ready')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
